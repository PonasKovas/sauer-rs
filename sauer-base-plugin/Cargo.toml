[package]
name = "sauer-base-plugin"
version = "0.1.0"
edition = "2024"

[dependencies]
sauer-server.workspace = true
sauer-proto.workspace = true
cube-string.workspace = true
rand.workspace = true
dashmap.workspace = true
tokio = { workspace = true, features = ["time"] }
