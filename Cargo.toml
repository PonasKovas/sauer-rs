[workspace]
members = ["cube-string", "sauer-proto", "ogz-rs", "sauer-map", "sauer-server", "sauer-plugin-lua", "example-server", "deathrun-plugin", "sauer-core", "telegram-plugin"]
resolver = "3"

[workspace.dependencies]
telegram-plugin.path = "telegram-plugin/"
cube-string.path = "cube-string/"
ogz-rs.path = "ogz-rs/"
sauer-core.path = "sauer-core/"
sauer-proto.path = "sauer-proto/"
sauer-server.path = "sauer-server/"
sauer-map.path = "sauer-map/"
sauer-plugin-lua.path = "sauer-plugin-lua/"
deathrun-plugin.path = "deathrun-plugin/"
lenet.path = "../lenet-rs/lenet/"
lenet-tokio.path = "../lenet-rs/lenet-tokio/"

num_enum = "0.7.6"
serde = "1.0.218"
thiserror = "2.0.11"
tracing = "0.1"
zerocopy = "0.8"
tokio = "1.0"
bytes = "1"
rand = "0.8"
tracing-subscriber = "0.3"
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
serde_json = "1"
anyhow = "1.0.102"
glam = "0.32.1"
crc32fast = "1.5.0"
byteorder = "1.5.0"
dashmap = "6.1.0"
anymap = "0.12.1"
mlua = "0.11.6"
toml = "1.1.2"
clap = "4.6.1"
bitcode = { version = "0.6", features = ["serde"] }
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls"] }

[profile.release]
debug = true
