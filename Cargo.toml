[workspace]
members = ["cube-string", "enet-rs", "sauer-proto", "ogz-rs", "sauer-map", "sauer-server", "enet-rs/enet-interop-test", "sauer-plugin-lua", "example-server", "deathrun-plugin"]
resolver = "3"

[workspace.dependencies]
cube-string.path = "cube-string/"
enet-rs.path = "enet-rs/"
ogz-rs.path = "ogz-rs/"
sauer-proto.path = "sauer-proto/"
sauer-server.path = "sauer-server/"
sauer-map.path = "sauer-map/"
sauer-plugin-lua.path = "sauer-plugin-lua/"
deathrun-plugin.path = "deathrun-plugin/"

num_enum = "0.7.6"
serde = "1.0.218"
thiserror = "2.0.11"
tracing = "0.1"
zerocopy = "0.8"
tokio = "1.0"
tokio-util = "0.7"
futures = "0.3"
bytes = "1"
rand = "0.8"
tracing-subscriber = "0.3"
flate2 = "1"
serde_json = "1"
anyhow = "1.0.102"
glam = "0.32.1"
crc32fast = "1.5.0"
byteorder = "1.5.0"
dashmap = "6.1.0"
anymap = "0.12.1"
mlua = "0.11.6"
toml = "1.1.2"
clap = "4.6.1"
bitcode = { version = "0.6", features = ["serde"] }
