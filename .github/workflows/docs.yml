name: Docs
on:
  push:
    branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
      # Same lenet-rs and elan setup as rust.yml.
      - name: Check out lenet-rs
        run: git clone --depth 1 https://github.com/PonasKovas/lenet-rs ../lenet-rs
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Configure cache
        uses: Swatinem/rust-cache@v2
      - name: Setup pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Clean docs folder
        run: cargo clean --doc
      - name: Build docs
        run: cargo doc --no-deps
      - name: Build Lua docs
        run: cargo xtask lua-docs target/doc/lua-api
      - name: Add index page
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><title>sauer-rs docs</title>'
            echo '<h1>sauer-rs docs</h1>'
            echo '<h2>Lua plugin API</h2><ul>'
            echo '<li><a href="lua-api/index.html">Reference</a></li>'
            echo '<li><a href="lua-api/sauer.lua">sauer.lua</a> (EmmyLua stubs for your editor)</li>'
            echo '</ul><h2>Rust crates</h2><ul>'
            for f in target/doc/*/index.html; do
              c=$(basename "$(dirname "$f")")
              [ "$c" = lua-api ] || [ "$c" = src ] || [ "$c" = static.files ] || echo "<li><a href=\"$c/index.html\">$c</a></li>"
            done
            echo '</ul>'
          } > target/doc/index.html
      - name: Remove lock file
        run: rm target/doc/.lock
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
